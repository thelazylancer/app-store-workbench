services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: appstore_workbench
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d appstore_workbench"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    user: "1000:1000"
    environment:
      NODE_ENV: production
      HOME: /home/app
      IPATOOL_BIN: /usr/local/bin/ipatool
      DOWNLOADS_DIR: /app/downloads
      IPA_RETENTION_DAYS: ${IPA_RETENTION_DAYS:-30}
      IPA_DOWNLOAD_TIMEOUT_MINUTES: ${IPA_DOWNLOAD_TIMEOUT_MINUTES:-60}
      SEARCH_CONCURRENCY: ${SEARCH_CONCURRENCY:-3}
      PRODUCT_PAGE_CACHE_TTL_SECONDS: ${PRODUCT_PAGE_CACHE_TTL_SECONDS:-600}
      PRODUCT_PAGE_CACHE_MAX_ENTRIES: ${PRODUCT_PAGE_CACHE_MAX_ENTRIES:-200}
      IPATOOL_KEYCHAIN_PASSPHRASE: ${IPATOOL_KEYCHAIN_PASSPHRASE:-}
      IPATOOL_PROXY: ${IPATOOL_PROXY:-}
      # App Privacy categories are only on the storefront HTML page, which Apple
      # geo-redirects for a mainland egress. Reuse the App Store proxy for HTTPS
      # fetch traffic and keep internal hosts direct.
      NODE_OPTIONS: --use-env-proxy
      HTTPS_PROXY: ${IPATOOL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,192.168.110.61}
      # Competitor daily snapshot feature.
      DATABASE_URL: postgres://aurora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/appstore_workbench
      FIRST_DELIVERY_API_URL: ${FIRST_DELIVERY_API_URL:-}
      FIRST_DELIVERY_API_BASE_URL: ${FIRST_DELIVERY_API_BASE_URL:-}
      FIRST_DELIVERY_API_KEY: ${FIRST_DELIVERY_API_KEY:-}
      COMPETITOR_DATA_DIR: /app/data/competitor
      # Keep the emulator runtime/SAP asset cache on the persisted volume.
      # Without this the container re-downloads the multi-GB macOS restore
      # image on every ipatool invocation and appears to hang.
      XDG_CACHE_HOME: /home/app/.ipatool/cache
    volumes:
      - ${IPA_DATA_DIR:-/srv/data/app-store-workbench}/ipatool:/home/app/.ipatool
      - ${IPA_DATA_DIR:-/srv/data/app-store-workbench}/ipa:/app/downloads
      - ${IPA_DATA_DIR:-/srv/data/app-store-workbench}/competitor:/app/data/competitor
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - proxy
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/app-details/0').then(() => process.exit(0)).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

networks:
  proxy:
    external: true
    name: ${IPATOOL_PROXY_NETWORK:-network-proxy_default}

volumes:
  pgdata:
