services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/app-details/0').then(() => process.exit(0)).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
